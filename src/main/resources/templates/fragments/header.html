<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="header">

<!-- Barre supérieure -->
<nav class="navbar navbar-dark bg-primary px-4">
  <a class="navbar-brand fw-bold" th:href="@{/}">MonApp</a>
  <a class="btn btn-outline-light btn-sm" th:href="@{/auth/login}">Connexion</a>
</nav>

<!-- Bloc historique des conversations -->
<aside class="bg-dark text-white p-3">
  <a th:href="@{/}" class="btn btn-outline-light w-100 mb-4">
    + Nouvelle conversation
  </a>

  <h6 class="text-secondary">Historique</h6>
  <div class="list-group">
    <a th:each="c : ${conversations}"
       th:href="@{/conversations/{id}(id=${c.id})}"
       th:text="${c.titre}"
       class="list-group-item list-group-item-action"
       th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
    </a>
  </div>
</aside>

</body>
</html>
